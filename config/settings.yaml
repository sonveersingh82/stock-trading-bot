# Stock Trading Bot

This repo is structured for Indian stock trading and is ready to be adapted to Dhan paper trading for:
- cash market stocks
- Sensex and index-related trading
- BSE/NSE equity and F&O instruments

## Recommended broker
Dhan is a good fit for this project because it supports a developer-friendly API and paper-trading workflow for testing strategy logic.

## Important usage note
Use the official Dhan API and official Dhan documentation. Do not scrape broker websites or BSE pages in production.

## Supported data approach
- Yahoo Finance: quick demo / fallback data
- Dhan API: preferred production provider for Indian market data and broker integration
- Paper trading: keep order execution in a simulated broker layer while the strategy logic remains reusable

## What this repo is designed for
- historical OHLCV data for stocks
- price and stock detail lookups
- strategy execution in a paper-trading simulation
- later expansion to Dhan order placement and portfolio tracking

## Dhan configuration
Add these to your environment before using the Dhan provider:

```bash
export DHAN_API_KEY="your_dhan_api_key"
export DHAN_ACCESS_TOKEN="your_dhan_access_token"
export DHAN_CLIENT_ID="your_client_id"
export DHAN_SYMBOL_TOKEN_MAP='{"RELIANCE": "3456", "HDFCBANK": "1337", "TCS": "11536", "SENSEX": "13"}'
```

Notes:
- Set `DHAN_SYMBOL_TOKEN_MAP` using the instrument tokens from your Dhan account and contract master.
- For Sensex and F&O contracts, use the exact Dhan instrument tokens and contract details from your Dhan account or Dhan contract master.
- If using BSE instruments, match them to the correct exchange code and token in your contract master.

## Target use case
This repo is intended to support:
- paper trading on Indian equities
- Sensex/index tracking
- BSE/NSE stock and F&O instrument lists
- strategy backtesting and simulation before live trading

## Setup

```bash
python -m venv .venv
source .venv/bin/activate
pip install -r requirements.txt
python -m app.main
```

## Config
Edit `config/settings.yaml`:

```yaml
provider: dhan
exchange: BSE
market_mode: paper_trade
```

For equity cash stocks, you may use `BSE` or `NSE` depending on the stock and your Dhan token mapping.
For F&O contracts, use the correct exchange and contract details from Dhan's contract master.

## Example

```python
from app.data import download_price_data

price_data = download_price_data(["RELIANCE", "HDFCBANK"], "2023-01-01", "2024-12-31", provider="dhan")
print(price_data["RELIANCE"].head())
```
