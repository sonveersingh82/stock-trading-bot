from __future__ import annotations

import argparse
import logging

from app.config import load_settings
from app.data import download_price_data
from app.paper_trader import PaperTrader


logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")


def main() -> None:
    parser = argparse.ArgumentParser(description="Simple stock trading bot")
    parser.add_argument("--settings", default="config/settings.yaml", help="Path to settings YAML")
    parser.add_argument("--symbols", nargs="*", default=None, help="Optional symbol override")
    args = parser.parse_args()

    settings = load_settings(args.settings)
    if args.symbols:
        settings.symbols = args.symbols

    data = download_price_data(settings.symbols, settings.start_date, settings.end_date)
    trader = PaperTrader(settings)
    trader.run(data)

    summary = trader.summary()
    print("Portfolio summary:")
    for key, value in summary.items():
        print(f"- {key}: {value}")


if __name__ == "__main__":
    main()
