from __future__ import annotations

import json
import os
from datetime import datetime
from typing import Any, Dict, Iterable, List, Optional

import pandas as pd
import requests
import yfinance as yf


SUPPORTED_PROVIDERS = {"yahoo", "angel", "dhan"}


def _require_env(*names: str) -> Dict[str, str]:
    values: Dict[str, str] = {}
    missing = []
    for name in names:
        value = os.getenv(name)
        if value:
            values[name] = value
        else:
            missing.append(name)
    if missing:
        raise ValueError(
            "Missing required environment variables for broker integration: "
            + ", ".join(missing)
        )
    return values


def _normalize_yahoo_dataframe(df: pd.DataFrame) -> pd.DataFrame:
    if df.empty:
        return df
    cleaned = df.rename(columns={
        "Open": "open",
        "High": "high",
        "Low": "low",
        "Close": "close",
        "Volume": "volume",
    })
    cleaned.index.name = "date"
    return cleaned


def _fetch_from_yahoo(symbol: str, start: str, end: str) -> pd.DataFrame:
    df = yf.download(
        symbol,
        start=start,
        end=end,
        auto_adjust=False,
        progress=False,
        threads=False,
    )
    return _normalize_yahoo_dataframe(df)


def _fetch_from_angel(symbol: str, start: str, end: str, exchange: str = "NSE") -> pd.DataFrame:
    env = _require_env("ANGEL_API_KEY", "ANGEL_CLIENT_CODE", "ANGEL_ACCESS_TOKEN")
    # SmartAPI historical candle endpoints are documented by Angel One.
    # The exact token depends on your symbol map, so this is designed as a provider-ready
    # integration point for your broker account rather than a hardcoded symbol lookup.
    symbol_token = os.getenv("ANGEL_SYMBOL_TOKEN_MAP", "").strip()
    if not symbol_token:
        raise ValueError(
            "Set ANGEL_SYMBOL_TOKEN_MAP as a JSON map like {\"RELIANCE\": \"2885\"}. "
            "You can also configure this per symbol in production."
        )

    token_map = json.loads(symbol_token)
    if symbol.upper() not in {k.upper(): v for k, v in token_map.items()}:
        raise ValueError(f"Symbol {symbol} not found in ANGEL_SYMBOL_TOKEN_MAP")

    token = str({k.upper(): v for k, v in token_map.items()}[symbol.upper()])
    from_ts = int(datetime.strptime(start, "%Y-%m-%d").timestamp())
    to_ts = int(datetime.strptime(end, "%Y-%m-%d").timestamp())

    headers = {
        "Authorization": f"Bearer {env['ANGEL_ACCESS_TOKEN']}",
        "Content-Type": "application/json",
        "X-Client-Code": env["ANGEL_CLIENT_CODE"],
        "X-Api-Key": env["ANGEL_API_KEY"],
    }

    params = {
        "exchange": exchange,
        "symboltoken": token,
        "interval": "ONE_DAY",
        "fromdate": start,
        "todate": end,
    }
    response = requests.get(
        "https://apiconnect.angelone.in/rest/secure/angelbroking/historical/v1/getCandleData",
        params=params,
        headers=headers,
        timeout=30,
    )
    response.raise_for_status()
    payload = response.json()

    candles = payload.get("data", [])
    if not candles:
        return pd.DataFrame()

    frame = pd.DataFrame(candles, columns=["timestamp", "open", "high", "low", "close", "volume"])
    frame["date"] = pd.to_datetime(frame["timestamp"], unit="s")
    frame = frame.set_index("date")
    frame = frame[["open", "high", "low", "close", "volume"]]
    return frame


def _fetch_from_dhan(symbol: str, start: str, end: str, exchange: str = "NSE") -> pd.DataFrame:
    env = _require_env("DHAN_API_KEY", "DHAN_ACCESS_TOKEN")
    # Dhan exposes official historical candle endpoints and symbol metadata through its API docs.
    # This function is kept as a proper provider hook so the repo can be pointed at the API
    # once you add your actual instrument mapping and endpoint details.
    raise NotImplementedError(
        "Dhan historical candles require the exact Dhan endpoint and instrument mapping for your account. "
        "Set up your Dhan API access and add the provider-specific URL and response parsing here."
    )


def get_historical_data(symbol: str, start: str, end: str, provider: str = "yahoo", exchange: str = "NSE") -> pd.DataFrame:
    provider_name = provider.lower()
    if provider_name == "yahoo":
        return _fetch_from_yahoo(symbol, start, end)
    if provider_name == "angel":
        return _fetch_from_angel(symbol, start, end, exchange=exchange)
    if provider_name == "dhan":
        return _fetch_from_dhan(symbol, start, end, exchange=exchange)
    raise ValueError(f"Unsupported provider: {provider}. Supported providers: {sorted(SUPPORTED_PROVIDERS)}")


def download_price_data(symbols: Iterable[str], start: str, end: str, provider: str = "yahoo", exchange: str = "NSE") -> Dict[str, pd.DataFrame]:
    data: Dict[str, pd.DataFrame] = {}
    for symbol in symbols:
        try:
            df = get_historical_data(symbol, start, end, provider=provider, exchange=exchange)
            if not df.empty:
                data[symbol] = df
        except Exception as exc:
            print(f"Skipping {symbol} on {provider}: {exc}")
    return data


def fetch_stock_details(symbol: str, provider: str = "yahoo", exchange: str = "NSE") -> Dict[str, Any]:
    provider_name = provider.lower()
    if provider_name == "yahoo":
        ticker = yf.Ticker(symbol)
        info = ticker.info or {}
        return {
            "symbol": symbol,
            "name": info.get("longName") or info.get("shortName") or symbol,
            "exchange": info.get("exchange") or exchange,
            "currency": info.get("currency") or "INR",
            "details": info,
        }

    if provider_name == "angel":
        env = _require_env("ANGEL_API_KEY", "ANGEL_CLIENT_CODE", "ANGEL_ACCESS_TOKEN")
        symbol_token = os.getenv("ANGEL_SYMBOL_TOKEN_MAP", "").strip()
        if not symbol_token:
            raise ValueError("ANGEL_SYMBOL_TOKEN_MAP is required for stock lookup details.")
        token_map = json.loads(symbol_token)
        token = str({k.upper(): v for k, v in token_map.items()}[symbol.upper()])
        headers = {
            "Authorization": f"Bearer {env['ANGEL_ACCESS_TOKEN']}",
            "Content-Type": "application/json",
            "X-Client-Code": env["ANGEL_CLIENT_CODE"],
            "X-Api-Key": env["ANGEL_API_KEY"],
        }
        response = requests.get(
            "https://apiconnect.angelone.in/rest/secure/angelbroking/order/v1/getLtpData",
            params={"exchange": exchange, "tradingsymbol": symbol},
            headers=headers,
            timeout=30,
        )
        response.raise_for_status()
        payload = response.json()
        return {"symbol": symbol, "exchange": exchange, "details": payload}

    if provider_name == "dhan":
        raise NotImplementedError("Dhan stock detail mapping must be added using your official API docs and instrument mapping.")

    raise ValueError(f"Unsupported provider: {provider}. Supported providers: {sorted(SUPPORTED_PROVIDERS)}")
